display_information:
  name: ZipMatch
  description: Sends messages with response buttons on behalf of other systems.
features:
  app_home:
    # Lets users see the DMs the bot sends them, without being able to reply in the DM.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: ZipMatch
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - users:read
      - users:read.email
settings:
  # Socket Mode delivers button clicks over a WebSocket, so no request_url is needed.
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
